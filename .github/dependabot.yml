version: 2
updates:
  # Actions GitHub (épinglées par SHA : Dependabot met à jour le SHA et le commentaire de version)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    labels: [dépendances]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Outils de dev et de build (requirements-dev.txt, requirements-build.txt).
  # L'application elle-même n'a aucune dépendance.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    labels: [dépendances]
    commit-message:
      prefix: "deps"
    groups:
      dev-tools:
        patterns: ["*"]
