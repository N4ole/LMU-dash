name: Valider les cartes
on:
  pull_request:
    paths: ["tracks/**", "tools/**", "store.py"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Les PR externes ne peuvent toucher que tracks/*.json
        if: github.event.pull_request.head.repo.fork
        run: |
          bad=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -vE '^tracks/[A-Za-z0-9._-]+\.json$' || true)
          if [ -n "$bad" ]; then echo "Fichiers refusés :"; echo "$bad"; exit 1; fi
      - run: python tools/validate_tracks.py
