name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Lancement manuel : construit et teste l'exe (artefact téléchargeable) sans publier de release.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build LMU-Dash.exe
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Check tag matches version.py
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(python -c "from version import VERSION; print(VERSION)")
          if [ "$TAG" != "v$v" ]; then
            echo "::error::Le tag $TAG ne correspond pas à version.py (v$v)."
            exit 1
          fi

      - name: Install PyInstaller
        run: python -m pip install -r requirements-build.txt

      - name: Build
        run: python tools/build_exe.py

      - name: Smoke test (--demo)
        run: python tools/smoke_test.py dist/LMU-Dash.exe

      - name: SHA256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/LMU-Dash.exe -Algorithm SHA256).Hash.ToLower()
          "$h  LMU-Dash.exe" | Out-File -Encoding ascii -NoNewline dist/LMU-Dash.exe.sha256
          "sha256=$h" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT
          "SHA256 : ``$h``" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LMU-Dash
          path: |
            dist/LMU-Dash.exe
            dist/LMU-Dash.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # créer la release et y attacher l'exe
      id-token: write # attestation de provenance (OIDC)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LMU-Dash
          path: dist

      - name: Verify SHA256
        working-directory: dist
        run: sha256sum --check LMU-Dash.exe.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/LMU-Dash.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          cat > notes.md <<EOF
          **Téléchargement :** \`LMU-Dash.exe\` ci-dessous (Windows, aucun prérequis).

          SHA256 : \`${SHA256}\`

          Vérifier l'authenticité (provenance signée par GitHub Actions) :
          \`\`\`
          gh attestation verify LMU-Dash.exe --repo ${GH_REPO}
          \`\`\`
          EOF
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/LMU-Dash.exe dist/LMU-Dash.exe.sha256 \
            --verify-tag --title "LMU Dash $TAG" --notes-file notes.md --generate-notes $prerelease
