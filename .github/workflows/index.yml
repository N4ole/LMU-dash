name: Index des cartes
on:
  push:
    branches: [main]
    paths: ["tracks/*.json"]

permissions: {}

jobs:
  index:
    name: Rebuild tracks index
    runs-on: ubuntu-latest
    permissions:
      contents: write # pousse tracks/index.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python tools/validate_tracks.py && python tools/build_index.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracks/index.json
          git diff --cached --quiet || (git commit -m "Mise à jour de l'index des cartes" && git push)
